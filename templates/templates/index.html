<!DOCTYPE html>
<html>
<head>
    <title>AI Weight Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="card p-4">
        <h2 class="text-center mb-4">Weight Predictor</h2>
        <div class="mb-3">
            <label class="form-label">Height (cm)</label>
            <input type="number" id="height" class="form-control" placeholder="Enter height...">
        </div>
        <button onclick="predict()" class="btn btn-primary w-100">Predict</button>
        <div id="result" class="mt-4 text-center fw-bold h4 text-success"></div>
    </div>

    <script>
        async function predict() {
            const h = document.getElementById('height').value;
            const res = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({height: h})
            });
            const data = await res.json();
            document.getElementById('result').innerText = data.weight ? `Result: ${data.weight} kg` : "Error";
        }
    </script>
</body>
</html>
